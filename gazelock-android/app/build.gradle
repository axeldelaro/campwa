apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePath = System.getenv("KEYSTORE_PATH")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD") ?: "gazelock2026"
def keyAliasName = System.getenv("KEY_ALIAS") ?: "gazelock"
def keyAliasPassword = System.getenv("KEY_PASSWORD") ?: "gazelock2026"

android {
    namespace "com.gazelock.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.gazelock.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "4.0.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (keystorePath != null && file(keystorePath).exists()) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyAliasPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePath != null && file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"

    // CameraX for reliable front-camera Eye/Gaze stream on Android 8-16!
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"

    // 100% On-Device Local AI: Google ML Kit Face Detection (Head Yaw/Pitch + Left/Right Eye Open Probabilities)
    implementation "com.google.mlkit:face-detection:16.1.7"
}
