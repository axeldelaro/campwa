name: Build & Release GazeLock AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'gazelock-android/**'
      - '.github/workflows/build-gazelock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gazelock-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist GazeLock Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.gazelock-signing
          key: gazelock-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.gazelock-signing
          KEYSTORE_FILE="$HOME/.gazelock-signing/gazelock-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias gazelock \
              -storepass gazelock2026 \
              -keypass gazelock2026 \
              -dname "CN=GazeLockAI, OU=Focus, O=GazeLockAI, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=gazelock2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=gazelock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=gazelock2026" >> "$GITHUB_ENV"

      - name: Compile Signed GazeLockAI Release APK
        working-directory: ./gazelock-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install GazeLockAI.apk
        run: |
          APK_OUT="gazelock-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "GazeLockAI Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./GazeLockAI.apk
          ls -lh ./GazeLockAI.apk

      - name: Upload GazeLockAI.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeLockAI-APK
          path: ./GazeLockAI.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed GazeLockAI.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazelock-v3.0.${{ github.run_number }}
          name: "GazeLock AI v3.0.${{ github.run_number }} (Overlay Semi-Transparent 45-50% Tactile Libre • #7 Flashs Subliminaux & Mantras • #8 Verrou Audio + Luminosité + Binaural • Portail 3 min Pop-ups & Mini-Jeux)"
          body: |
            ### 👁️ GazeLock AI v3.0 (`gazelock-v3.0.${{ github.run_number }}`)
            - **👻 Overlay Semi-Transparent (45–50 % opacité, tactile 100 % déverrouillé)** : la vidéo remplit tout l'écran en surimpression pendant que tu continues d'utiliser toutes tes applis normalement — avec pilule flottante déplaçable (zéro bouton fermer), mode **`∞ Infini`** optionnel, et anti-évasion chirurgical bloquant Paramètres / Désinstallation / Force-Stop (`+15 s`) !
            - **🧩 Portail 3 Minutes en Overlay (Spam 0,1 s + Pop-ups + Mini-Jeux)** : unique moyen de retirer les vidéos en cours — 3 minutes imposées directement en overlay avec spam d'images à `0,1 s`, **pop-ups interactifs chronométrés** (Présence, Piège, Flash ×3, `+8–10 s` si ignorés) et **3 mini-jeux obligatoires** utilisant les vraies images du dossier (**Puzzle à glissement `3×3`**, **Reconstitution par échange `3×3`** et **Redressement par rotation `3×3`**) !
            - **⚡ #7 Flashs Subliminaux (0,08 s–0,22 s) & Mantras Néon** : flashs ultra-courts d'images du dossier + phrases néon personnalisables en pleine vidéo (compatibles mode Semi-Transparent et Verrouillé).
            - **🔊 #8 Verrouillage Audio Absolu + Luminosité Max + Battement Binaural Hypnotique** : interception matérielle des touches `Volume Bas` / `Muet` via Accessibilité, plancher volume `40–100 %`, luminosité overlay forcée à `100 %` et pulsation binaurale synthétisée en local (`AudioTrack` stéréo).
            - **Inclus aussi (v2.0)** : #2 Suivi Pupilles/Iris IA local, #12 Pénalités Fixe/Progressive/Mort Subite & #13 Anti-Évasion Total.
          files: ./GazeLockAI.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
