name: Build & Release GazeLock AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'gazelock-android/**'
      - '.github/workflows/build-gazelock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gazelock-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist GazeLock Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.gazelock-signing
          key: gazelock-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.gazelock-signing
          KEYSTORE_FILE="$HOME/.gazelock-signing/gazelock-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias gazelock \
              -storepass gazelock2026 \
              -keypass gazelock2026 \
              -dname "CN=GazeLockAI, OU=Focus, O=GazeLockAI, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=gazelock2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=gazelock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=gazelock2026" >> "$GITHUB_ENV"

      - name: Compile Signed GazeLockAI Release APK
        working-directory: ./gazelock-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install GazeLockAI.apk
        run: |
          APK_OUT="gazelock-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "GazeLockAI Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./GazeLockAI.apk
          ls -lh ./GazeLockAI.apk

      - name: Upload GazeLockAI.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeLockAI-APK
          path: ./GazeLockAI.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed GazeLockAI.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazelock-v7.0.${{ github.run_number }}
          name: "GazeLock AI v7.0.${{ github.run_number }} TITAN (40 Nouvelles Features : Forteresse Anti-Évasion, IA Anti-Triche, Saturation Vidéo, Pop-Ups Physique/Surge/Esquive & 18 Mini-Jeux)"
          body: |
            ### 👁️ GazeLock AI v7.0 TITAN (`gazelock-v7.0.${{ github.run_number }}`) — 40 Nouvelles Features de Durcissement & d'Intensité
            - **🛡️ Forteresse Anti-Évasion & Système (#1–#7)** : `FLAG_SECURE` anti-screenshot sur Portail/Boss/Full-Lock, **Anti-Écran Scindé & Anti-Fenêtre Flottante (`+15 s`)**, **Watchdog auto-guérisseur Z-order (`1,5 s`)**, **Garde Audio Stricte** même en Pop-Ups Verrouillés, **Blocage Volet Notifs en Pop-Ups Verrouillés**, **Survie Immortelle Pop-Ups après reboot**, et **Taxe Écran Éteint (`+20 s & +10 %`)**.
            - **👁️ IA Regard & Anti-Triche Biométrique (#8–#14)** : **Calibration Auto Point Zéro (`3 s`)**, **Anti-Caméra Obstruée (`+10 s & +12 % + sirène`)**, **Garde Distance Visage**, **Détecteur Anti-Somnolence (`> 1,6 s → sirène`)**, **Rigueur Croissante automatique**, **Score de Discipline en direct (`0–100 %`, Note `S+..F`)**, et **Garde Solo-Visage**.
            - **🎬 Saturation Vidéo & Sensorielle (#15–#21)** : **Respiration Opacité Ghost (`±7 %`)**, **Glitch Chromatique & Secousse sur faute**, **Vitesse Vidéo Dynamique (`0,86× → 1,30×`)**, **Bandeaux Filigranes Mantras Défilants 60 FPS**, **Freeze-Frame Photo-Bombe (`94 % / 0,9 s`)**, **Haptique Cardiaque (`lub-dub`)**, et **Tunnel d'Induction `10 s` à `95 %`**.
            - **🖼️ Mode Pop-Ups d'Images TITAN (#22–#29)** : **Physique Dérive & Rebond 60 FPS**, **Pulsation Respiratoire**, **Pop-Ups Esquiveurs (`35 %` esquivent le 1er clic !)**, **Déferlantes SURGE (`×3` vitesse 6 s / 25 s)**, **Spirale Hypnotique 60 FPS**, **Audio Binaural intégré**, **Boost Regard IA (`×2` vitesse si regard détourné)**, **4 Presets Tempête 1-Tap** (`Doux / Intensif / Ouragan ∞ / APOCALYPSE ∞`) + bouton `🧹 Vider` sur la pilule libre.
            - **🧩 Portail 3–6 min : 18 Mini-Jeux Visuels + Durcissements (#30–#35)** : **+4 nouveaux mini-jeux hardcore** (*🎯 Cibles Mouvantes*, *🔐 Code Visuel de Photos*, *🔍 Loupe Micro-Détail `3×`*, *⚖️ Photo Jumelle ou Piège*), **Taxe d'Annulation (`+30 s & +10 %`)**, **Clavier Tactile Obligatoire à 6 chiffres**, **Mode Zéro Tolérance (`×2` erreurs + pop-ups pièges)** & **Combo `🔥 ON FIRE ×N`**.
            - **🏆 Contrôle & Tableau de Bord (#36–#40)** : **☢️ Bouton Rouge TITAN OVERLORD 1-Tap**, **💣 Bombe à Retardement aléatoire (`10–180 min`)**, **📜 Contrat Quotidien, Streak & Rangs (`Novice → OVERLORD`)**, **🔐 Verrou Anti-Désactivation des Réglages (`1 h / 6 h / 24 h`)**, **Interface à 5 Onglets** & **Bilan Post-Session détaillé** !
          files: ./GazeLockAI.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
