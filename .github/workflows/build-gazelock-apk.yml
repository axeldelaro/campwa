name: Build & Release GazeLock AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'gazelock-android/**'
      - '.github/workflows/build-gazelock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gazelock-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist GazeLock Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.gazelock-signing
          key: gazelock-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.gazelock-signing
          KEYSTORE_FILE="$HOME/.gazelock-signing/gazelock-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias gazelock \
              -storepass gazelock2026 \
              -keypass gazelock2026 \
              -dname "CN=GazeLockAI, OU=Focus, O=GazeLockAI, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=gazelock2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=gazelock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=gazelock2026" >> "$GITHUB_ENV"

      - name: Compile Signed GazeLockAI Release APK
        working-directory: ./gazelock-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install GazeLockAI.apk
        run: |
          APK_OUT="gazelock-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "GazeLockAI Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./GazeLockAI.apk
          ls -lh ./GazeLockAI.apk

      - name: Upload GazeLockAI.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeLockAI-APK
          path: ./GazeLockAI.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed GazeLockAI.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazelock-v6.0.${{ github.run_number }}
          name: "GazeLock AI v6.0.${{ github.run_number }} MEGA (Pop-Ups d'Images ∞ Illimités 60 FPS jusqu'à 33/s + 14 Mini-Jeux Visuels + Portail 3–12 Défis)"
          body: |
            ### 👁️ GazeLock AI v6.0 MEGA (`gazelock-v6.0.${{ github.run_number }}`)
            - **🖼️🔥 Mode Pop-Ups d'Images MEGA (Hors Vidéos · Moteur GPU 60 FPS)** :
              - **Nombre simultanés ÉNORME ou ∞ ILLIMITÉ** : `1..150` ou **`∞ ILLIMITÉ`** (jusqu'à **360 pop-ups empilés à 60 FPS** sur scène GPU unique, zéro lag !), mode fenêtres flottantes individuelles conservé pour `≤ 12` en mode cliquable
              - **Fréquences ultra-larges** : **`30 ms` (33 pop-ups/s !)** jusqu'à **`60 s`** (curseurs logarithmiques ultra-précis + presets `30 ms / 50 ms / 0,1 s / 0,25 s / 0,5 s / 1,5 s / 5 s / 15 s`)
              - **Salves simultanées** : **`×1` à `×12` images d'un coup** par tick + **🌊 Rampe d'Accélération** (accélère progressivement jusqu'à **4×** sur 3 min !)
              - **Taille MIN / MAX aléatoire** (`12 % – 100 %`, presets `Vignettes`, `Moyen`, `Géant`, `Chaos ∞`)
              - **Durée de vie** : `0,1 s – 60 s` ou **`∞ Persistant`** (ne disparaît jamais tout seul !)
              - **4 Zones d'apparition** (`🎲 Partout`, `🎯 Centre`, `🖼️ Bords`, `🧱 Collage`), **5 Animations d'entrée** (`💥 Zoom`, `⚡ Flash`, `🌊 Glisse`, `🌀 Tourbillon`, `🎲 Aléatoire`), **5 Styles de cadre** (`🌈 Néon`, `❤️ Rouge`, `📸 Polaroid`, `🚫 Sans bord`, `⚡ Double`)
              - **Opacité `15–100 %`** + **Opacité aléatoire**, **💨 Swipe-Away (glisser pour éjecter)**, **🧬 Mitose**, **🔊 Son Pavlov**, sessions `∞ / 1–60 min` et **🔒 Verrouillage de sortie optionnel** (Portail + Anti-Évasion).
            - **🧩 14 Mini-Jeux Visuels dans le Portail 3–6 min (+6 NOUVEAUX v6.0 + 3 à 12 Défis configurables + ⚡ Combo Sans-Faute !)** :
              1. **🪙 Gratte & Identifie** *(NOUVEAU)* — Gratte la pellicule métallique au doigt puis identifie la bonne photo parmi 4
              2. **🔗 Chaîne Mahjong d'Images 4×4** *(NOUVEAU)* — Relie les 8 paires adjacentes, sur ligne dégagée, bord ou angle en L
              3. **🎨 Cherche la Copie Altérée 3×3** *(NOUVEAU)* — 9 copies de la même photo, repère celle à teinte/contraste modifié sous 8,5 s
              4. **🔢 Réflexe Visuel de Symboles** *(NOUVEAU)* — Compte les symboles `★`/`◆` lumineux sur la photo sous 7,5 s
              5. **⏱️ Verrous de Précision** *(NOUVEAU)* — 4 jauges de plus en plus rapides à stopper dans la zone verte pour révéler la photo
              6. **🎞️ Réalignement de Bandes 5×1** *(NOUVEAU)* — Reconstitue 2 photos découpées en 5 bandes verticales puis horizontales
              - **+ les 8 mini-jeux existants** : Taquin 3×3, Taquin 4×4 Enfer, Chasse Éclair 9 img/s, Échange 3×3, Rotation 3×3, Memory 4×3, Séquence 1→9 & Intrus 3×3
              - **Nombre de défis réglable (`3` / `6 Intense` / `9 Extrême` / `12 Marathon`)** + **⚡ Combo Sans-Faute (`COMBO ×N`)** !
            - **Inclut aussi tout l'arsenal APOCALYPSE v5.0** : Ghost 48%→96%, Boss Final 30s, Anti-Clignement, Applis Piégées, Blocage Volet Ghost, Taxe Changement d'Appli, Pavlov Audio, Spirale 60 FPS & Mode Immortel.
          files: ./GazeLockAI.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
