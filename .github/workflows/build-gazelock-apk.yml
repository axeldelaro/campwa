name: Build & Release GazeLock AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'gazelock-android/**'
      - '.github/workflows/build-gazelock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gazelock-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist GazeLock Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.gazelock-signing
          key: gazelock-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.gazelock-signing
          KEYSTORE_FILE="$HOME/.gazelock-signing/gazelock-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias gazelock \
              -storepass gazelock2026 \
              -keypass gazelock2026 \
              -dname "CN=GazeLockAI, OU=Focus, O=GazeLockAI, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=gazelock2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=gazelock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=gazelock2026" >> "$GITHUB_ENV"

      - name: Compile Signed GazeLockAI Release APK
        working-directory: ./gazelock-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install GazeLockAI.apk
        run: |
          APK_OUT="gazelock-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "GazeLockAI Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./GazeLockAI.apk
          ls -lh ./GazeLockAI.apk

      - name: Upload GazeLockAI.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeLockAI-APK
          path: ./GazeLockAI.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed GazeLockAI.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazelock-v5.1.${{ github.run_number }}
          name: "GazeLock AI v5.1.${{ github.run_number }} (Nouveau Mode Pop-Ups d'Images Hors Vidéos 100 % Réglable + Tout l'Arsenal APOCALYPSE v5.0)"
          body: |
            ### 👁️ GazeLock AI v5.1 (`gazelock-v5.1.${{ github.run_number }}`)
            - **🖼️ NOUVEAU — Mode Pop-Ups d'Images (Hors Vidéos)** : tourne de façon totalement indépendante sans lancer de vidéo, par-dessus toutes tes applis, avec un dossier images dédié (masqués `.*` inclus) ou réutilisation du dossier principal !
              - **Taille réglable** (`25 % – 92 %` largeur écran + presets `35 / 55 / 75 / 90 %`, ratio photo respecté)
              - **Fréquence réglable** (`0,3 s – 30,0 s` + presets `0,5 s / 1,5 s / 3 s / 8 s`)
              - **Durée par pop-up** (`0,4 s – 15,0 s`), **Max simultanés** (`1 – 8` pop-ups en même temps !), **Opacité** (`35 % – 100 %`)
              - **3 Modes Tactiles** : `👻 Tactile Libre`, `👆 Cliquable` (`1–3 clics` + option **🧬 Mitose** qui divise un pop-up ignoré en 2 !), `🔒 Bloquant` (impossible à fermer pendant sa durée)
              - **Extras** : inclinaison aléatoire (`±13°`), mantras néon, vibrations, durée de session (`∞` / `3–15 min`), et **🔒 Verrouillage de sortie optionnel** (Portail 3–6 min + Anti-Évasion obligatoires !).
            - **Inclut aussi tout l'arsenal APOCALYPSE v5.0** : Boss Final 30s, Anti-Clignement, Applis Piégées, Blocage Volet Ghost, Taxe Changement d'Appli, Pavlov Audio, Taquin 4×4, Chasse 9 img/s, Portail Progressif 3→6m, Ghost 48%→96%, Spirale 60 FPS & Mode Immortel.
          files: ./GazeLockAI.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
