name: Build & Release GazeLock AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'gazelock-android/**'
      - '.github/workflows/build-gazelock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gazelock-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist GazeLock Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.gazelock-signing
          key: gazelock-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.gazelock-signing
          KEYSTORE_FILE="$HOME/.gazelock-signing/gazelock-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias gazelock \
              -storepass gazelock2026 \
              -keypass gazelock2026 \
              -dname "CN=GazeLockAI, OU=Focus, O=GazeLockAI, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=gazelock2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=gazelock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=gazelock2026" >> "$GITHUB_ENV"

      - name: Compile Signed GazeLockAI Release APK
        working-directory: ./gazelock-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install GazeLockAI.apk
        run: |
          APK_OUT="gazelock-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "GazeLockAI Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./GazeLockAI.apk
          ls -lh ./GazeLockAI.apk

      - name: Upload GazeLockAI.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeLockAI-APK
          path: ./GazeLockAI.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed GazeLockAI.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazelock-v4.0.${{ github.run_number }}
          name: "GazeLock AI v4.0.${{ github.run_number }} ULTRA EXTREME (Opacité Vivante • Coupures d'Emprise • Micro-Popups • Zones Mortes • 6 Mini-Jeux • Sprint 20 FPS • Spirale • Dette de Temps • Immortel)"
          body: |
            ### 👁️ GazeLock AI v4.0 ULTRA EXTREME (`gazelock-v4.0.${{ github.run_number }}`)
            - **📈 #1 Emprise Progressive (Opacité Vivante `48 % → 96 %`)** : en mode Semi-Transparent, l'opacité grimpe au fil du temps, des écarts de regard, des micro-pop-ups ignorés et des tentatives d'évasion — jusqu'à forcer une Coupure d'Emprise à `96 %` !
            - **⚡ #2 Coupures d'Emprise (`Attention Hijack`)** : en plein usage normal du téléphone, l'overlay confisque soudainement le tactile à `96 %` d'opacité jusqu'à `14 s` de regard ininterrompu !
            - **🖼️ #5 Micro-Pop-Ups Fantômes** : fenêtres compactes avec photo du dossier + mantra + barre `6,5 s` pendant l'usage normal (`+6 %` d'opacité si ignoré !).
            - **🚫 #9 Zones Mortes Tactiles Punitives** : bloque une zone centrale de l'écran sur faute de regard — rétrécit uniquement quand tu fixes l'écran !
            - **🧩 #16 6 Mini-Jeux Visuels du Dossier (sans dictée)** : Taquin `3×3`, Reconstitution échange `3×3`, Rotation `3×3`, **🧠 Memory Flash `4×3`**, **🎯 Séquence Fuyante `1→9`** & **🔍 Trouve l'Intrus Éclair (3 manches)** !
            - **🔥 #17 Sprint Surcharge (`00:45 → 00:00`)** : spam accéléré à **`0,05 s` (`20 FPS`)**, pop-ups 2× plus rapides, battement binaural `118 BPM`, et échec/timeout renvoie le chrono à **`01:00`** !
            - **💸 #18 Dette de Temps** : interrompre via le portail 3 min reporte `50–100 %` du temps restant sur la prochaine session (soldé uniquement en finissant jusqu'à `00:00` !).
            - **🌀 Arsenal Ultra-Intense inclus** : **#21 Spirale Hypnotique `60 FPS`**, **#22 Portail 3 min Verrouillé par le Regard Caméra**, **#23 Voix TTS Hypnotique (Chuchotement Mantras)**, **#24 Chrono Aveugle (`??:??`) & Roulette Chaos**, **#25 Anti-Pose Accéléromètre (table)** et **#26 Mode Immortel (`+45 s` après reboot/déverrouillage)** !
          files: ./GazeLockAI.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
