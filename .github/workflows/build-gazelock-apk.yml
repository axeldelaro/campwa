name: Build & Release GazeLock AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'gazelock-android/**'
      - '.github/workflows/build-gazelock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gazelock-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist GazeLock Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.gazelock-signing
          key: gazelock-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.gazelock-signing
          KEYSTORE_FILE="$HOME/.gazelock-signing/gazelock-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias gazelock \
              -storepass gazelock2026 \
              -keypass gazelock2026 \
              -dname "CN=GazeLockAI, OU=Focus, O=GazeLockAI, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=gazelock2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=gazelock" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=gazelock2026" >> "$GITHUB_ENV"

      - name: Compile Signed GazeLockAI Release APK
        working-directory: ./gazelock-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install GazeLockAI.apk
        run: |
          APK_OUT="gazelock-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "GazeLockAI Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./GazeLockAI.apk
          ls -lh ./GazeLockAI.apk

      - name: Upload GazeLockAI.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GazeLockAI-APK
          path: ./GazeLockAI.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed GazeLockAI.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazelock-v5.0.${{ github.run_number }}
          name: "GazeLock AI v5.0.${{ github.run_number }} APOCALYPSE (Boss Final 30s • Anti-Clignement • Applis Piégées • Taquin 4×4 • Chasse 9 img/s • Portail Progressif 3→6m • Pavlov)"
          body: |
            ### 👁️ GazeLock AI v5.0 APOCALYPSE (`gazelock-v5.0.${{ github.run_number }}`)
            - **👁️ #11 Défi Anti-Clignement Extrême** : t'impose périodiquement `8–20 s` sans cligner des yeux (surveillé en direct par ML Kit) — cligner = **`+15 s` + Opacité `+8 %`** + buzzer !
            - **🪤 #21 Embuscades sur Applis Piégées (`App-Trap`)** : sélecteur d'applis installées — ouvrir une appli piégée (TikTok, Instagram, Chrome, YouTube…) injecte instantanément une session overlay !
            - **🚫 #29 Blocage du Panneau de Contrôle en mode Ghost** : referme automatiquement le volet de notifications / raccourcis rapides même en mode Semi-Transparent !
            - **🔀 #30 Taxe Changement d'Appli (`> 3 applis/min`)** : zapper entre plus de 3 applis par minute en mode Ghost inflige **`+10 s` + `+5 %` d'opacité** !
            - **🔔 #36 Conditionnement Sonore Pavlovien** : carillon cristallin synthétisé toutes les `30 s` de regard parfait / victoire mini-jeu, et buzzer dissonant immédiat sur chaque faute !
            - **🔥 #51 Taquin `4×4` Mode Enfer (15 tuiles)** : puzzle à glissement `4×4` avec les vraies photos du dossier + aide optimale instantanée (`+5 s`).
            - **⚡ #54 Chasse au Motif Éclair à `9 img/s` (`111 ms`)** : mémorise la cible dorée puis frappe STOP en plein vol dans un flux à **`9 images/seconde`** (3 manches, `+5 s` par erreur) !
            - **📈 #70 Portail Progressif Journalier** : chaque déblocage complété dans la même journée allonge la durée imposée du portail (**`3 min → 4 min → 5 min → 6 min`**) !
            - **👑 #76 Boss Final de Fin de Session (`30 s`)** : les 30 dernières secondes passent à **`100 %` verrouillé Zéro Faute** (accélération binaurale `118 BPM`) — un écart `> 1 s` inflige **`+60 s` de pénalité** !
            - **Inclut aussi tout l'arsenal v1–v4** : Ghost 48%→96%, Coupures d'Emprise, Micro-Popups, Zones Mortes, Spirale 60 FPS, Subliminal #7, Verrou Audio/Lum/Binaural #8, Dette de Temps #18, Sprint 20 FPS #17, Portail Regard #22, Chuchotements TTS, Chrono Aveugle & Mode Immortel.
          files: ./GazeLockAI.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
