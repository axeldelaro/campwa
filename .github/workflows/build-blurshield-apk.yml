name: Build & Release BlurShield AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'blurshield-android/**'
      - '.github/workflows/build-blurshield-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blurshield-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist BlurShield Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.blurshield-signing
          key: blurshield-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.blurshield-signing
          KEYSTORE_FILE="$HOME/.blurshield-signing/blurshield-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias blurshield \
              -storepass blurshield2026 \
              -keypass blurshield2026 \
              -dname "CN=BlurShield, OU=Vision, O=BlurShield, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=blurshield2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=blurshield" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=blurshield2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="blurshield-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p blurshield-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed BlurShield Release APK
        working-directory: ./blurshield-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install BlurShield.apk
        run: |
          APK_OUT="blurshield-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "BlurShield Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./BlurShield.apk
          ls -lh ./BlurShield.apk

      - name: Upload BlurShield.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlurShield-APK
          path: ./BlurShield.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed BlurShield.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blurshield-v1.0.${{ github.run_number }}
          name: "BlurShield AI v1.0.${{ github.run_number }} (Flou Visages & NSFW Autonome • 120 FPS • Réglages Pro)"
          body: |
            ### BlurShield AI (`blurshield-v1.0.${{ github.run_number }}`)

            Application Android autonome dédiée exclusivement au **floutage temps réel des visages et contenus NSFW** (100 % local, aucun compte, aucun serveur, indépendant de SentinelCam).

            - **Superposition officielle par Service d’Accessibilité (`TYPE_ACCESSIBILITY_OVERLAY`)** : fonctionne au-dessus de toutes les applis sans popup, avec suivi du défilement en 0 ms et rendu GPU 60–120 FPS (`Choreographer`).
            - **Mode Autonome (Android 11+)** + **Mode Turbo Vidéo 30 Hz** en 1 clic pour une fluidité quasi parfaite sur les vidéos rapides (TikTok, YouTube, Reels).
            - **Zones granulaires** : Visages (Tous / Femmes / Hommes), Zones intimes, Poitrine/Torse, Fesses, Ventre/Nombril, Mode strict zones couvertes, et Zone d’écran active (ROI Haut/Bas).
            - **5 types de flou & 3 formes** : Flou Gaussien réel (`FastStackBlur`), Mosaïque Pixel, Verre dépoli, Teinte unie, Masque noir • Contour organique 36 points, Ovale doux, Rectangle arrondi • Sliders d’intensité, marge et fluidité + aperçu en direct.
            - **Contrôle rapide** : filtrage par applications (exclure ou cibler), pastille flottante Pause/Reprise, compteur FPS/latence HUD et tuile Réglages rapides Android.
          files: ./BlurShield.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
