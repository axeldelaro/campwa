name: Build & Release BlurShield AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'blurshield-android/**'
      - '.github/workflows/build-blurshield-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blurshield-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist BlurShield Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.blurshield-signing
          key: blurshield-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.blurshield-signing
          KEYSTORE_FILE="$HOME/.blurshield-signing/blurshield-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias blurshield \
              -storepass blurshield2026 \
              -keypass blurshield2026 \
              -dname "CN=BlurShield, OU=Vision, O=BlurShield, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=blurshield2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=blurshield" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=blurshield2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="blurshield-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p blurshield-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed BlurShield Release APK
        working-directory: ./blurshield-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install BlurShield.apk
        run: |
          APK_OUT="blurshield-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "BlurShield Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./BlurShield.apk
          ls -lh ./BlurShield.apk

      - name: Upload BlurShield.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlurShield-APK
          path: ./BlurShield.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed BlurShield.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blurshield-v2.0.${{ github.run_number }}
          name: "BlurShield AI v2.0.${{ github.run_number }} (Silhouette IA • Kalman 0-Lag 120Hz • Shaders GPU • Emoji Réactif)"
          body: |
            ### BlurShield AI v2.0 (`blurshield-v2.0.${{ github.run_number }}`)

            Application Android autonome dédiée exclusivement au **floutage temps réel ultra-fluide des visages et contenus NSFW** (100 % local, aucun compte, indépendant de SentinelCam).

            - **#1 Segmentation Silhouette IA au pixel près** (`ML Kit Selfie Segmentation`) : détourage précis cheveux/épaules/corps + mode **Silhouette Corps Entier**.
            - **#2 Suivi prédictif Kalman 0-Lag (120 FPS)** : anticipation du vecteur de vitesse entre 2 frames IA + glissement des contours organiques sans latence + **Mode Turbo Vidéo 35 Hz**.
            - **#3 Masquage chirurgical par sous-zone du visage** : Visage complet, Yeux seuls, Bouche seule, Haut du visage, Yeux + Bouche, Tête + Cheveux (133 points IA).
            - **#4 Suivi 3D angle de tête (Euler X/Y/Z)** : rotation et compensation de profil en temps réel.
            - **#5 Affinage couleur de peau adaptatif (YCbCr/HSV)** : resserre les masques NSFW sur la peau réelle sans déborder sur les vêtements ou le décor.
            - **#9 Shaders GPU natifs Android 13+ (`RuntimeShader` AGSL)** : Bokeh Optique, Verre Strié Cathédrale, Distorsion Liquide animée, Cristal Voronoi et Glitch Cyberpunk à 120 FPS (avec rendu natif haute vitesse API 26–32).
            - **#10 Remplacement dynamique** : **Emoji réactif** (suit sourire & clin d'œil + inclinaison 3D) et **Image personnelle** depuis la Galerie.
            - **Finition chirurgicale** : fondu progressif des bords (*Feathering* 0–100 %), opacité réglable (35–100 %), zone d’écran active (ROI), filtrage par applis, pastille flottante et tuile Réglages rapides.
          files: ./BlurShield.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
