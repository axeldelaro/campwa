name: Build & Release SentinelCam Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Native Kotlin + WebRTC Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 34 & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore or Persist Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.sentinelcam-signing
          key: sentinelcam-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.sentinelcam-signing
          KEYSTORE_FILE="$HOME/.sentinelcam-signing/sentinelcam-release.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          elif [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias sentinelcam \
              -storepass sentinelcam2026 \
              -keypass sentinelcam2026 \
              -dname "CN=SentinelCam, OU=Security, O=SentinelCam, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASS:-sentinelcam2026}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-sentinelcam}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${SECRET_KEY_PASS:-sentinelcam2026}" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          if [ ! -f "android/app/src/main/assets/nudenet_320n.onnx" ]; then
            mkdir -p android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o android/app/src/main/assets/nudenet_320n.onnx
          fi
          ls -lh android/app/src/main/assets/nudenet_320n.onnx

      - name: Compile Signed Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install SentinelCam.apk & Compute MDM Checksum
        run: |
          APK_OUT="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./SentinelCam.apk
          ls -lh ./SentinelCam.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            MDM_SIG_HASH=$("$APKSIGNER" verify --print-certs ./SentinelCam.apk \
              | grep -m1 "Signer #1 certificate SHA-256 digest:" \
              | awk '{print $NF}' \
              | xxd -r -p \
              | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          else
            MDM_SIG_HASH=$(keytool -exportcert -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" -rfc \
              | openssl x509 -outform DER \
              | openssl dgst -binary -sha256 \
              | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          fi
          echo "MDM_SIG_HASH=$MDM_SIG_HASH" >> "$GITHUB_ENV"
          echo "Computed Android Enterprise Signature Checksum (from actual APK): $MDM_SIG_HASH"

      - name: Upload SentinelCam.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SentinelCam-APK
          path: ./SentinelCam.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v28.1.${{ github.run_number }}
          name: "SentinelCam v28.1.${{ github.run_number }} (Audit & Fiabilisation Complète Contrôle Parental + DNS/VPN IPv4/IPv6 + UI Clair/Sombre)"
          body: |
            ### SentinelCam v28.1 (`v28.1.${{ github.run_number }}`)

            Téléchargez et installez **`SentinelCam.apk`** (Android 8.0 à Android 15+).

            - **Corrections Critiques du Contrôle Parental & Auto-Contrôle** :
              - **Suppression de la boucle de blocage sur l’écran d’accueil** : le garde-fou anti-désinstallation sur le launcher ne se déclenche désormais que sur le menu « Infos appli / Désinstaller » ciblant SentinelCam, jamais sur la simple icône du bureau.
              - **Popups de permissions Android débloquées** : `permissioncontroller` n’est plus bloqué et une fenêtre de grâce est accordée automatiquement lors de chaque demande de permission (Caméra, Micro, GPS, SMS, Contacts, Galerie, VPN, Admin).
              - **PIN Paramètres véritablement chirurgical** : le menu principal des Paramètres Android (Wi-Fi, Bluetooth, Son, Luminosité) reste accessible, tandis que les sous-pages critiques (Accessibilité, Admin, Développeur, Réinitialisation, Date/Heure, Infos SentinelCam) sont bloquées avec précision. Le Play Store reste strictement verrouillé quand l’option anti-contournement est active.
              - **Détection Shorts / Reels / Incognito sans faux positifs** : le Tueur de flux et le compteur de swipes ciblent uniquement les vrais lecteurs plein écran (les vidéos longues YouTube et fils normaux Instagram/Facebook ne sont plus fermés), et le bloqueur Incognito ne ferme plus les pages web ordinaires.
              - **Réactivité `< 50 ms` sur les blocages d’applis** : `AppLockMonitor` priorise la détection instantanée Accessibilité, résout l’heure exacte de fin de couvre-feu sommeil, et évite tout conflit entre Mode Parent et Mode Auto-Contrôle lors de l’appairage.
            - **Pare-feu DNS/VPN Local durci Android 14/15 & 4G/5G IPv6** :
              - Déclaration `FOREGROUND_SERVICE_TYPE_SPECIAL_USE` sur Android 14/15 (`targetSdk 34`), bascule réseau fluide (`setUnderlyingNetworks(null)`), prise en charge complète des paquets DNS **IPv6 UDP/53** (zéro fuite sur opérateurs 4G/5G), et correction de SafeSearch sur requêtes `AAAA`/`HTTPS` (Google/YouTube).
            - **Connexion & Commandes 100 % garanties** :
              - Keepalive MQTT calibré (`90s`, ping `45s`), mode Haute Disponibilité automatique pendant l’appairage 6 caractères, et **file d’attente hors-ligne + réveil push automatique** étendus à 100 % des règles parentales.
            - **Finition Visuelle Kidslox Clair & Sombre** :
              - Contraste corrigé sur 100 % des cartes, dégradés, badges et boutons en thème Clair et Sombre (Web & Android), et refonte haute lisibilité de l’écran de verrouillage natif `AppBlockActivity`.

            `MDM_SIGNATURE_CHECKSUM:${{ env.MDM_SIG_HASH }}`
          files: ./SentinelCam.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
