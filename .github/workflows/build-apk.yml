name: Build & Release SentinelCam Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Native Kotlin + WebRTC Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 34 & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore or Persist Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.sentinelcam-signing
          key: sentinelcam-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.sentinelcam-signing
          KEYSTORE_FILE="$HOME/.sentinelcam-signing/sentinelcam-release.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          elif [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias sentinelcam \
              -storepass sentinelcam2026 \
              -keypass sentinelcam2026 \
              -dname "CN=SentinelCam, OU=Security, O=SentinelCam, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASS:-sentinelcam2026}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-sentinelcam}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${SECRET_KEY_PASS:-sentinelcam2026}" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          if [ ! -f "android/app/src/main/assets/nudenet_320n.onnx" ]; then
            mkdir -p android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o android/app/src/main/assets/nudenet_320n.onnx
          fi
          ls -lh android/app/src/main/assets/nudenet_320n.onnx

      - name: Compile Signed Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install SentinelCam.apk
        run: |
          APK_OUT="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./SentinelCam.apk
          ls -lh ./SentinelCam.apk

      - name: Upload SentinelCam.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SentinelCam-APK
          path: ./SentinelCam.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v24.0.${{ github.run_number }}
          name: "SentinelCam v24.0.${{ github.run_number }} (Messages Réseaux Sociaux + Réponse Directe • Analyse des Conversations & Sujets • Captures Auto par App • Correctif Désinstallation)"
          body: |
            ### SentinelCam v24.0 (`v24.0.${{ github.run_number }}`)

            Téléchargez et installez **`SentinelCam.apk`** (Android 8.0 à Android 15+).

            - **Messages Réseaux Sociaux & Réponse Directe (WhatsApp, Instagram, Snapchat, Discord, Messenger, TikTok, Telegram, Signal)** : archivage discret sur le téléphone même si l’enfant supprime ses messages, réponse directe depuis l’Espace Parent et alertes automatiques sur vos mots-clés sensibles — sans jamais masquer les notifications de l’enfant.
            - **Analyse locale des conversations & habitudes** : découvrez en un coup d’œil avec qui l’enfant échange le plus (SMS + appels + réseaux réunis), les nouveaux contacts intensifs, la synthèse des sujets récurrents et mots fréquents, ainsi que l’activité nocturne (22h–06h).
            - **Captures d’écran automatiques par application** : choisissez précisément les applications à surveiller et la fréquence (toutes les 5 à 60 s) avec déduplication intelligente, galerie dédiée, zoom plein écran et effacement total à la dissociation.
            - **Correctif désinstallation à distance** : ajout de la permission officielle Android `REQUEST_DELETE_PACKAGES` + ouverture directe de la boîte de désinstallation même avec la protection Paramètres active.
            - **Inclut toute la fiabilité v20–v23** : journal & blocage d’appels, enregistrement différé hors-ligne, centre matériel/système, carte GPS zones > 130 km/h, et révocation totale des droits parentaux si l’appareil est délié.
          files: ./SentinelCam.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
