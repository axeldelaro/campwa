name: Build & Release SentinelCam Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "android-apk-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Native Kotlin + WebRTC Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 34 & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM dependencies & Build Web Assets
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Restore or Persist Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.sentinelcam-signing
          key: sentinelcam-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.sentinelcam-signing
          KEYSTORE_FILE="$HOME/.sentinelcam-signing/sentinelcam-release.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          elif [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias sentinelcam \
              -storepass sentinelcam2026 \
              -keypass sentinelcam2026 \
              -dname "CN=SentinelCam, OU=Security, O=SentinelCam, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASS:-sentinelcam2026}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-sentinelcam}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${SECRET_KEY_PASS:-sentinelcam2026}" >> "$GITHUB_ENV"

      - name: Compile Signed Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install SentinelCam.apk
        run: |
          APK_OUT="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./SentinelCam.apk
          ls -lh ./SentinelCam.apk

      - name: Upload SentinelCam.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SentinelCam-APK
          path: ./SentinelCam.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.0.${{ github.run_number }}
          name: "SentinelCam v9.0.${{ github.run_number }} (Stabilité Caméra & Écran • Protection Administrateur • Interface Épurée)"
          body: |
            ### SentinelCam v9.0 (`v9.0.${{ github.run_number }}`)

            Téléchargez et installez **`SentinelCam.apk`** (Android 8.0 à Android 15+).

            - **Correction définitive des pertes caméra** :
              - Ajout d’un `CameraEventsHandler` avec auto-récupération en cas d’interruption système (dialogue d’autorisation d’écran, veille, freeze).
              - Promotion `ForegroundService` par priorités progressives (activer le partage d’écran ou le GPS ne retire plus jamais les types `CAMERA` / `MICROPHONE`).
              - Suppression des redémarrages redondants au retour de dialogue et pause propre du capteur Camera2 lors des bascules + reprise automatique côté Web.
            - **Protection Administrateur par code (type contrôle parental)** :
              - Définissez un code administrateur (4 à 12 caractères) et activez l’administrateur d’appareil Android natif (`DeviceAdminReceiver`) pour maintenir la tâche de fond active et protéger l’arrêt ou la désinstallation par code.
            - **Interface épurée et moderne** :
              - Site Web et application Android simplifiés, structurés et débarrassés de tout texte superflu ou jargon technique.
            - **Toutes les fonctions incluses** : Caméra HD, Partage d’Écran, Talkie Haut-Parleur 1-Sens, Historique GPS continu hors-ligne (Ultra-Éco), Contacts, Relais SMS d’urgence + redirections gratuites, Pass temporaires & Amis.
          files: ./SentinelCam.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
