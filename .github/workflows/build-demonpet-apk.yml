name: Build & Release DemonMom AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'demonpet-android/**'
      - '.github/workflows/build-demonpet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demonpet-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist DemonMom Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.demonpet-signing
          key: demonpet-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.demonpet-signing
          KEYSTORE_FILE="$HOME/.demonpet-signing/demonpet-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias demonpet \
              -storepass demonpet2026 \
              -keypass demonpet2026 \
              -dname "CN=DemonMom, OU=Companion, O=DemonMom, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demonpet2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demonpet" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demonpet2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="demonpet-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p demonpet-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed DemonMom Release APK
        working-directory: ./demonpet-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install DemonMom.apk
        run: |
          APK_OUT="demonpet-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "DemonMom Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./DemonMom.apk
          ls -lh ./DemonMom.apk

      - name: Upload DemonMom.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemonMom-APK
          path: ./DemonMom.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed DemonMom.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demonmom-v4.1.${{ github.run_number }}
          name: "DemonMom RPG v4.1.${{ github.run_number }} (Shizuku Natif Android 16 • Dégâts Applis par Usage sans Reset • Femdom Witch RPG Plein Écran)"
          body: |
            ### DemonMom RPG v4.0 (`demonmom-v4.0.${{ github.run_number }}`)

            Édition majeure **Femdom Witch RPG Plein Écran (style *Monster Girl Quest*) + Vrais Dégâts MDM Device Owner par ordre d'usage** :

            - **Détourage automatique IA des Sorcières (#93, #94, #100)** : chaque image de ton dossier (masqués `.*` inclus) est détourée automatiquement en **sprite Visual Novel plein écran** avec cache rapide, fiche de Boss générée et fond gothique flouté.
            - **Scène Plein Écran 60 FPS Live2D-lite (#95, #96, #98, #99, #119, #120)** : cercle magique runique rotatif, respiration/zoom d'attaque/rapprochement en capture, orbes d'énergie aspirées, vignettage battement de cœur et dégradation visuelle progressive pendant le drainage.
            - **Combat RPG complet (#101–#108, #110, #113–#115)** : triple jauge (`PV / PM / Emprise / NV`), **3 phases** (Approche → **Capturé/Entravé** avec **QTE Se débattre 10 taps** → Drainage), altérations (*Charmé*, *Hypnotisé*, *Scellé*), Garde contre Sort Ultime, choix RP, **renfort Duo d'une 2e Sorcière**, **scène cinématique de fin de drainage en 3 étapes** et **écran d'évaluation sarcastique façon MGQ** !
            - **Vrais Dégâts MDM (Device Owner ADB/Termux) + Restauration 100 % garantie** : chaque défaite suspend tes applis **par ordre réel d'usage** (`UsageStatsManager`) et peut poser des sceaux réversibles (Caméra, Play Store, Captures, Luminosité). Tout est réactivé automatiquement par **🕊️ Fin du jeu : Tout restaurer**, en gagnant un combat (+1 appli libérée) ou via le **code d'urgence `100205`** (20 taps sur le démon ou le badge `NV`).
          files: ./DemonMom.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
