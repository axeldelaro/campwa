name: Build & Release DemonMom AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'demonpet-android/**'
      - '.github/workflows/build-demonpet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demonpet-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist DemonMom Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.demonpet-signing
          key: demonpet-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.demonpet-signing
          KEYSTORE_FILE="$HOME/.demonpet-signing/demonpet-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias demonpet \
              -storepass demonpet2026 \
              -keypass demonpet2026 \
              -dname "CN=DemonMom, OU=Companion, O=DemonMom, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demonpet2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demonpet" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demonpet2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="demonpet-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p demonpet-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed DemonMom Release APK
        working-directory: ./demonpet-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install DemonMom.apk
        run: |
          APK_OUT="demonpet-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "DemonMom Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./DemonMom.apk
          ls -lh ./DemonMom.apk

      - name: Upload DemonMom.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemonMom-APK
          path: ./DemonMom.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed DemonMom.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demonmom-v5.0.${{ github.run_number }}
          name: "DemonMom RPG v5.0.${{ github.run_number }} (Jeu Complet 50 Sorcières • 5 Chapitres & 10 Boss • IA Dialogue Instantané • Shizuku Punitions Système)"
          body: |
            ### DemonMom RPG v5.0 (`demonmom-v5.0.${{ github.run_number }}`)

            Transformation complète en **jeu RPG Android autonome de 50 Sorcières (style *Monster Girl Quest*)**, jouable directement plein écran dans l'application **ET** en embuscades système :

            - **50 Sorcières uniques réparties en 5 Chapitres** (40 Sorcières + 5 Mini-Boss Élite + 5 Archisorcières Boss) avec **Grimoire interactif** : chaque Sorcière reçoit aléatoirement une photo de ton dossier choisi (masqués `.*` et `.nomedia` inclus), **détourée automatiquement par IA (ML Kit)** en sprite Visual Novel HD plein écran !
            - **Moteur de Dialogue IA Instantané & Non Répétitif** : générateur local 0 ms en français (8 archétypes, 13 phases, mémoire anti-répétition sur 30 répliques) + **champ Clé API Google Gemini optionnel** dans *⚙️ Dossier & IA* pour des dialogues 100 % générés en direct par IA cloud.
            - **Système de Combat RPG complet façon *Monster Girl Quest*** : jauges `PV / PM / SP (0–100) / Emprise % / Niveau / XP / Éclats 💎`, `⚔️ Frappe (+15 SP)`, `🔥 Lame Spirituelle (-15 PM)`, `🛡️ Garde (+20 PM, -70 % vs Sort Ultime)`, `✨ Sceau d'Exorcisme (50 SP, -45 % Emprise)`, **4 Reliques & Boutique** (*Élixir*, *Cristal*, *Talisman*, *Amulette*), **Phase 2 Capturé + QTE 10 taps**, renfort Duo, **scène cinématique de fin de drainage en 4 étapes** (registre dark-fantasy/dramatique) et **Oracle Post-Défaite MGQ**.
            - **Punitions Système réelles en cas de défaite (Shizuku Android 16 sans reset / MDM)** : suspend/gèle tes applis **par ordre réel d'usage** (`UsageStatsManager`), fond d'écran trophée et drainage luminosité/visuel — 100 % réversible à tout moment via **🕊️ Fin du jeu : Tout restaurer**, en gagnant un combat (+1 appli libérée) ou via **20 taps + code `100205`**.
          files: ./DemonMom.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
