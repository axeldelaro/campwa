name: Build & Release DemonMom AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'demonpet-android/**'
      - '.github/workflows/build-demonpet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demonpet-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist DemonMom Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.demonpet-signing
          key: demonpet-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.demonpet-signing
          KEYSTORE_FILE="$HOME/.demonpet-signing/demonpet-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias demonpet \
              -storepass demonpet2026 \
              -keypass demonpet2026 \
              -dname "CN=DemonMom, OU=Companion, O=DemonMom, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demonpet2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demonpet" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demonpet2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="demonpet-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p demonpet-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed DemonMom Release APK
        working-directory: ./demonpet-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install DemonMom.apk
        run: |
          APK_OUT="demonpet-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "DemonMom Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./DemonMom.apk
          ls -lh ./DemonMom.apk

      - name: Upload DemonMom.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemonMom-APK
          path: ./DemonMom.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed DemonMom.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demonmom-v7.0.${{ github.run_number }}
          name: "DemonMom RPG v7.0.${{ github.run_number }} (Fix Éjection Scène Fin • Pleins Pouvoirs Applis & Tactile en Combat • Intrigue 5 Actes & Hasard • Plein Écran Forcé)"
          body: |
            ### DemonMom RPG v7.0 (`demonmom-v7.0.${{ github.run_number }}`)

            Correctif définitif de l'éjection des scènes de fin + mode **Pleins Pouvoirs des Sorcières, Intrigue Complète & Suspens** :

            - **Fix définitif de l'éjection des scènes de fin (2 causes trouvées & éliminées)** :
              1. `MainActivity` déclare désormais `android:configChanges` complet ET le fond d'écran trophée est appliqué uniquement à la sortie de l'étape 5 (sur Android 12–16 Material You / HyperOS, `WallpaperManager.setBitmap()` déclenchait un rechargement de thème qui recréait l'Activity et éjectait la scène de fin !).
              2. En mode Overlay, `presentFullscreenOverlay()` ne détruit plus `sessionActive` au montage du duel.
            - **Attaques sur tes Applis & Sabotage Tactile LIVE *en plein combat* (évolutif selon ton Niveau NV)** :
              - **Prise d'otage d'applis via Shizuku en cours de duel** : les Sorcières grisent ton appli la plus utilisée en plein combat (`🔒 OTAGE EN COURS`) — bats-la pour la libérer immédiatement !
              - **6 Sabotages Tactiles évolutifs (`Dom.0/3 → Dom.3/3` de NV 25 à NV 1)** : *Boutons qui fuient ton doigt*, *Givre Tactile (2–3 taps)*, *Commandes mélangées*, *Bouton Piège Mimique*, *Brouillard d'Incertitude (`???`)* et *Verrou Tactile « À genoux »*.
            - **Intrigue Complète en 5 Actes (15 scènes + 3 Fins) & Suspens/Hasard** :
              - Scénario *Les Chroniques de l'Éclipse* avec jauge d'alignement (`🔥 Volonté` / `⚖️ Équilibre` / `💜 Ombre`), **Roue du Destin**, **3 Coffres Scellés (dont Sorcière Mimique !)**, **Marchande des Ombres**, **Raids Système imprévus**, **Faille d'Éclipse flottante (réflexe 2,8 s)**, **Bluff de Sorcière**, **Orage Runique ×1.5** et **Sursaut d'Adrénaline à 1 PV**.
            - **Mode Plein Écran Forcé** : Plein Écran Immersif Sticky (masque les barres système) + option **Overlay Système Forcé** bloquant tout l'OS via Accessibilité jusqu'à l'issue du combat (ou `20 taps + 100205`).
          files: ./DemonMom.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
