name: Build & Release DemonMom AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'demonpet-android/**'
      - '.github/workflows/build-demonpet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demonpet-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist DemonMom Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.demonpet-signing
          key: demonpet-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.demonpet-signing
          KEYSTORE_FILE="$HOME/.demonpet-signing/demonpet-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias demonpet \
              -storepass demonpet2026 \
              -keypass demonpet2026 \
              -dname "CN=DemonMom, OU=Companion, O=DemonMom, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demonpet2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demonpet" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demonpet2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="demonpet-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p demonpet-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed DemonMom Release APK
        working-directory: ./demonpet-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install DemonMom.apk
        run: |
          APK_OUT="demonpet-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "DemonMom Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./DemonMom.apk
          ls -lh ./DemonMom.apk

      - name: Upload DemonMom.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemonMom-APK
          path: ./DemonMom.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed DemonMom.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demonmom-v9.0.${{ github.run_number }}
          name: "DemonMom RPG v9.0.${{ github.run_number }} (12 Pouvoirs Shizuku • Pactes Maudits & 4e QTE • Petit Démon 100% Shizuku/Accessibilité sans faux positifs notifs)"
          body: |
            ### DemonMom RPG v9.0 (`demonmom-v9.0.${{ github.run_number }}`)
            - **12 Pouvoirs Shizuku concrets & 100 % réversibles** : Épinglage plein écran (`am task lock`), Ralentissement Android ×3,5, Illusion Batterie 3 %, Distorsion Zoom DPI, Double Otage d'applis, Disparition d'appli (`pm disable-user`), Isolement Notifs + DND, Sceau Micro & Presse-papiers, Mode Éclipse Sombre/Éco, Claquement d'écran, Force-Stop + Rappel jeu, Auto-octroi des 4 permissions spéciales !
            - **Nouveautés RPG Sorcières** : Pactes Maudits de Phase 2 (dilemme tactique), 4e QTE d'évasion « Chasse aux Orbes d'Hypnose », indice Faiblesse Tactique en début de duel !
            - **Petit Démon réparé** : Zéro panique sur les notifications, horloge, MIUI security ou batterie — 100 % recentré sur **Shizuku + Accessibilité** !

            Refonte tactique majeure — **Vraies logiques de combat par Sorcière, Attaques Système Concrètes & Vidéo Forcée impossible à quitter pendant qu'elle agit en arrière-plan** :

            - **Combats beaucoup plus longs & zéro spam (`🛡️ Posture / Break`)** : Résolution fortement augmentée (`281 → 985` sur les Boss) + **Jauge de Posture (`100–165`)** réduisant les frappes simples tant que la Posture n'est pas brisée (*Lame*, *Contre-Sceau*, *Parade Parfaite*, *QTE* → **💥 RUPTURE 2 tours ×2.0 dégâts**). Spammer la même attaque recharge la Posture de la Sorcière !
            - **8 Cerveaux IA & Logiques Uniques par Archétype (`WitchCombatAi`)** :
              - *Charmeuse* (Parfum : tes frappes charmées la soignent), *Enlaceuse* (Fils de Soie 0→3 = Capture auto), *Hypnotiseuse* (Vidéo Forcée + Silence Audio + Brouillard), *Vampirique* (Vol de Vie continu + Siphon SP + Inversion de Soin), *Inquisitrice* (**Lois Sacrées** interdisant Frappe / Magie / Sac / Garde avec Sentence punitive + Otage d'Appli), *Illusionniste* (Mirage + Mélange tactile), *Chrono* (Sablier 4→0 Arrêt du Temps + Givre ×3), *Souveraine* (3 Phases Royales complètes).
            - **🎬 Transe Vidéo Forcée en Plein Combat (8–11 s impossible à quitter !)** : lance une vidéo de ton dossier (masqués `.*` inclus, ou montage photo si 0 vidéo) plein écran tandis que la Sorcière **agit en direct en arrière-plan** : baisse de luminosité système, flashs lampe torche LED, **grisement d'appli en otage via Shizuku**, drain PM/Emprise et mélange de tes commandes !
            - **Attaques Concrètes sur le Téléphone (100 % réversibles)** : Double Otage d'applis Shizuku, Sceau Play Store / Caméra / Luminosité en plein combat, Sceau Silence Audio, Flash Torche LED, Vol temporaire de Relique, Chrono de Pression en Phase 2/3 — tout restauré automatiquement à la Victoire, par **🕊️ Tout restaurer** ou par **`20 taps + 100205`** !
          files: ./DemonMom.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
