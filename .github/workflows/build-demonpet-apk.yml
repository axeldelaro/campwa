name: Build & Release DemonMom AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'demonpet-android/**'
      - '.github/workflows/build-demonpet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demonpet-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist DemonMom Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.demonpet-signing
          key: demonpet-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.demonpet-signing
          KEYSTORE_FILE="$HOME/.demonpet-signing/demonpet-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias demonpet \
              -storepass demonpet2026 \
              -keypass demonpet2026 \
              -dname "CN=DemonMom, OU=Companion, O=DemonMom, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demonpet2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demonpet" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demonpet2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="demonpet-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p demonpet-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed DemonMom Release APK
        working-directory: ./demonpet-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install DemonMom.apk
        run: |
          APK_OUT="demonpet-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "DemonMom Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./DemonMom.apk
          ls -lh ./DemonMom.apk

      - name: Upload DemonMom.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemonMom-APK
          path: ./DemonMom.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed DemonMom.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demonmom-v3.0.${{ github.run_number }}
          name: "DemonMom AI v3.0.${{ github.run_number }} (Ultra-Réalisme • Chronos Blindés • RPG Séduction & Drain • Tournoi #69 • Pause 3m #68 • Autel Piégé #87)"
          body: |
            ### DemonMom AI v3.0 (`demonmom-v3.0.${{ github.run_number }}`)

            Grosse mise à jour **Ultra-Réalisme + Chronos 100 % blindés + Combat RPG Séduction & Drainage + Nouvelles Fonctions (#68, #69, #71, #87)** :

            - **Correctif critique de tous les chronos (`SystemClock.elapsedRealtime()`)** : le chrono de `#38 Au Coin Vidéo` descend toujours de façon fluide et fiable (plus jamais figé !), le démon reste toujours au premier plan au-dessus de toutes les modales (**20 taps + `100205`** toujours accessible !), et `#39` normalise accents et apostrophes.
            - **Diable Ultra-Réaliste v3** : détourage HD `640×800` anti-frange cheveux, **Rim-Light cinéma épousant le contour réel du visage**, queue 3D articulée, cornes 3D striées évolutives avec la colère, ailes veinées ombrées, yeux vivants qui suivent tes gestes (braise rouge ou violet hypnotique) + flammes/orbes.
            - **Combat RPG Séduction & Drainage (type MGQ)** : attaques nommées interactives avec **drainage de Niveau (`NV`)**, **drainage de luminosité** et **drainage de qualité photo en temps réel** (pixellisation + voile hypnotique auto-réversible).
            - **#68 Pause écran obligatoire toutes les 3 minutes** (réglable `1–30 min`), **#69 Taxe d'entrée Duel / Tournoi éliminatoire de 2, 4 ou 8 médias**, **#71 Bloqueur Play Store / Acheter / Installer**, **#87 Autel Photo Piégé impossible à retirer** (le toucher déclenche d'autres gages en superposition !).
          files: ./DemonMom.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
