name: Build & Release DemonMom AI APK (Standalone)

on:
  push:
    branches:
      - main
    paths:
      - 'demonpet-android/**'
      - '.github/workflows/build-demonpet-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-demonpet-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
          fi
          mkdir -p "$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Persist DemonMom Signing Keystore Cache
        uses: actions/cache@v4
        with:
          path: ~/.demonpet-signing
          key: demonpet-release-keystore-v1

      - name: Prepare Release Keystore (V1 + V2 Signed APK)
        run: |
          mkdir -p ~/.demonpet-signing
          KEYSTORE_FILE="$HOME/.demonpet-signing/demonpet-release.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias demonpet \
              -storepass demonpet2026 \
              -keypass demonpet2026 \
              -dname "CN=DemonMom, OU=Companion, O=DemonMom, L=Paris, S=IDF, C=FR"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=demonpet2026" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=demonpet" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=demonpet2026" >> "$GITHUB_ENV"

      - name: Ensure Bundled NudeNet v3 ONNX Model
        run: |
          MODEL_PATH="demonpet-android/app/src/main/assets/nudenet_320n.onnx"
          if [ ! -f "$MODEL_PATH" ]; then
            mkdir -p demonpet-android/app/src/main/assets
            curl -fsSL "https://raw.githubusercontent.com/notAI-tech/NudeNet/v3/nudenet/320n.onnx" -o "$MODEL_PATH"
          fi
          ls -lh "$MODEL_PATH"

      - name: Compile Signed DemonMom Release APK
        working-directory: ./demonpet-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package Ready-to-Install DemonMom.apk
        run: |
          APK_OUT="demonpet-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_OUT" ]; then
            echo "DemonMom Release APK not found at $APK_OUT"
            exit 1
          fi
          cp "$APK_OUT" ./DemonMom.apk
          ls -lh ./DemonMom.apk

      - name: Upload DemonMom.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DemonMom-APK
          path: ./DemonMom.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish Signed DemonMom.apk to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demonmom-v2.1.${{ github.run_number }}
          name: "DemonMom AI v2.1.${{ github.run_number }} (Sévérité Réelle & Correctifs Accessibilité + Vidéo Au Coin)"
          body: |
            ### DemonMom AI v2.0 (`demonmom-v2.0.${{ github.run_number }}`)

            Mise à jour majeure **Design Photo-Réaliste + 16 pouvoirs d'Accessibilité sévères & interactifs + Interface épurée 4 onglets** :

            - **Avatar Photo-Réaliste HD (512×640)** : détourage studio du vrai portrait/buste (tête + cheveux + épaules), ombre portée douce, ailes sombres texturées, **cornes 3D posées aux coordonnées exactes du front**, **yeux braise sur les vraies pupilles** en mode Furieux et 4 styles réalistes.
            - **16 nouveaux pouvoirs Accessibilité & Discipline** : #26 contre-scroll gestuel, #27 Retour compulsif, #29 mise en pause forcée des vidéos, #31 vol de clics & #37 anti-Like/Follow, #32 sabotage de saisie clavier, #34 fermeture du panneau de notifications, #35 blocage Réglages Rapides, **#38 Punition « Au coin ! » avec vidéo en boucle du dossier (masqués `.*` inclus)**, #39 lignes à recopier anti-copier-coller, #42 Zone Morte clavier, #44 Liste Noire Totale, #50 esquive du doigt, #53 Quiz surprise, #61 diaporama forcé 4 photos, #65 4 profils de sévérité en 1 clic.
            - **Verrouillage strict des Paramètres Android + Administrateur** : sortie propre garantie en tapotant le démon **20 fois de suite** + code **`100205`**.
            - **Interface épurée 4 onglets** : *Démon*, *Studio*, *Pouvoirs*, *Réglages*.
          files: ./DemonMom.apk
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
