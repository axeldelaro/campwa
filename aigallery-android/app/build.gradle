apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePath = System.getenv("KEYSTORE_PATH")
def keystorePassword = System.getenv("KEYSTORE_PASSWORD") ?: "aigallery2026"
def keyAliasName = System.getenv("KEY_ALIAS") ?: "aigallery"
def keyAliasPassword = System.getenv("KEY_PASSWORD") ?: "aigallery2026"

android {
    namespace "com.aigallery.pro"
    compileSdk 34

    defaultConfig {
        applicationId "com.aigallery.pro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (keystorePath != null && file(keystorePath).exists()) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyAliasPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePath != null && file(keystorePath).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // Ultra-fast thumbnail, GIF & video frame loading (same engine as Simple Gallery Pro!)
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // 100% On-Device Local AI Face Detection + 133-Point Landmarks/Contours (Zero Cloud!)
    implementation "com.google.mlkit:face-detection:16.1.7"
}
